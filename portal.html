<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"><title>Öğrenci Paneli | DeutschKampus</title>
<link rel="stylesheet" href="fa.css"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="common.css">
</head><body>
<header><a href="index.html"><img src="logo.png" alt="DeutschKampus"></a><div><span id="who" class="muted"></span> <button class="btn ghost small" id="out">Çıkış</button></div></header>
<div class="wrap" id="app"><div class="card">Yükleniyor…</div></div>
<script>window.DK_CFG={url:"https://kqtbjhiheiqrpvocoudw.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxdGJqaGloZWlxcnB2b2NvdWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NTEyMjUsImV4cCI6MjEwOTIyNzIyNX0.a2WSq4qbWkElQsVDERIZgWsMM4spvJC7xytyNKJmOSQ"};</script>
<script src="dk.js"></script>
<script>
let ME=null;
const money=n=>Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2})+' €';
const dt=d=>d?new Date(d).toLocaleDateString('tr-TR'):'—';
document.getElementById('out').onclick=async()=>{await DK.signOut();location.href='login.html'};
async function load(){
 const s=await DK.session(); if(!s){location.href='login.html';return}
 const uid=await DK.uid();const p=await DK.get('profiles','select=*&id=eq.'+uid); ME=p[0]; if(!ME){location.href='login.html';return}
 if(ME.role==='admin'){location.href='admin.html';return}
 document.getElementById('who').textContent=ME.full_name||ME.email;
 const id='student_id=eq.'+ME.id;
 const [steps,apps,docs,msgs,pays]=await Promise.all([
  DK.get('steps',id+'&order=position'),DK.get('applications',id+'&order=created_at'),DK.get('documents',id+'&order=id'),
  DK.get('messages',id+'&order=created_at'),DK.get('payments',id+'&order=id')]);
 render(steps,apps,docs,msgs,pays);
}
function render(steps,apps,docs,msgs,pays){
 let h='<div class="card"><h2>Merhaba'+(ME.full_name?' '+esc(ME.full_name):'')+'</h2><p class="muted" style="margin:0">'+(ME.target?'Hedefiniz: '+esc(ME.target):'Sürecinizin güncel durumu aşağıda.')+'</p></div>';
 h+='<div class="card"><h2>Süreç adımları</h2><div class="steps">'+steps.map(s=>'<div class="step '+s.status+'"><b>'+esc(s.position+'. '+s.title)+'</b><span class="pill '+s.status+'">'+L.step[s.status]+'</span>'+(s.note?'<div class="muted" style="margin-top:6px">'+esc(s.note)+'</div>':'')+'</div>').join('')+'</div></div>';
 h+='<div class="card"><h2>Üniversite başvurularınız</h2>'+(apps.length?'<table><tr><th>Üniversite</th><th>Bölüm</th><th>Son tarih</th><th>Durum</th></tr>'+apps.map(a=>'<tr><td>'+esc(a.university)+'</td><td>'+esc(a.program||'')+'</td><td>'+dt(a.deadline)+'</td><td><span class="pill '+a.status+'">'+L.app[a.status]+'</span>'+(a.note?'<div class="muted">'+esc(a.note)+'</div>':'')+'</td></tr>').join('')+'</table>':'<p class="muted">Henüz başvuru eklenmedi. Üniversite seçimini birlikte belirleyeceğiz.</p>')+'</div>';
 h+='<div class="card"><h2>Belgeleriniz</h2><p class="muted">PDF, JPG veya PNG, en fazla 10 MB. Belgeleriniz yalnızca size ve DeutschKampus ekibine görünür.</p><table><tr><th>Belge</th><th>Durum</th><th></th></tr>'+docs.map(d=>'<tr><td>'+esc(d.title)+(d.note?'<div class="muted">'+esc(d.note)+'</div>':'')+'</td><td><span class="pill '+d.status+'">'+L.doc[d.status]+'</span></td><td>'+(d.status==='approved'?'':'<label class="btn small ghost" style="display:inline-block;margin:0">'+(d.file_path?'Yenile':'Yükle')+'<input type="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="up('+d.id+',this)"></label>')+'</td></tr>').join('')+'</table><div id="upm"></div></div>';
 h+='<div class="card"><h2>Mesajlar</h2><div id="thread">'+msgs.map(m=>'<div class="msg '+m.sender+'"><small>'+(m.sender==='admin'?'DeutschKampus':'Siz')+' · '+new Date(m.created_at).toLocaleString('tr-TR')+'</small>'+esc(m.body)+'</div>').join('')+(msgs.length?'':'<p class="muted">Henüz mesaj yok.</p>')+'</div><textarea id="nm" rows="3" placeholder="Mesajınızı yazın…" style="margin-top:10px"></textarea><div style="margin-top:8px"><button class="btn" onclick="send()">Gönder</button></div></div>';
 h+='<div class="card"><h2>Ödemeler</h2>'+(pays.length?'<table><tr><th>Kalem</th><th>Tutar</th><th>Not</th><th>Durum</th></tr>'+pays.map(x=>'<tr><td>'+esc(x.label)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.due_note||'')+'</td><td><span class="pill '+x.status+'">'+L.pay[x.status]+'</span></td></tr>').join('')+'</table>':'<p class="muted">Ödeme planı sözleşmeyle birlikte burada görünecek.</p>')+'</div>';
 document.getElementById('app').innerHTML=h;
}
async function up(id,inp){const f=inp.files[0];if(!f)return;const m=document.getElementById('upm');
 if(f.size>10*1024*1024){m.innerHTML='<div class="err">Dosya 10 MB\'tan büyük.</div>';return}
 const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
 if(!['pdf','jpg','jpeg','png'].includes(ext)){m.innerHTML='<div class="err">Sadece PDF, JPG veya PNG.</div>';return}
 m.innerHTML='<div class="muted">Yükleniyor…</div>';
 try{const path=ME.id+'/'+id+'-'+Date.now()+'.'+ext;await DK.upload(path,f);
  await DK.patch('documents','id=eq.'+id,{status:'uploaded',file_path:path,uploaded_at:new Date().toISOString()});await load()}
 catch(e){m.innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
async function send(){const t=document.getElementById('nm').value.trim();if(!t)return;
 try{await DK.insert('messages',{student_id:ME.id,sender:'student',body:t});await load()}catch(e){alert(e.message)}}
load().catch(e=>{document.getElementById('app').innerHTML='<div class="card"><div class="err">'+esc(e.message)+'</div></div>'});
</script></body></html>
