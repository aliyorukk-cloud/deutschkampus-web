üne yakın daha uygun banliyöleri tercih eder.`

             city: "Dresden",

             detail: `🏫 <strong>Akademik Profil ve Popüler Bölümler:</strong>\nEski Doğu Almanya'nın en prestijli teknik üniversitesidir. <strong>Elektrik Mühendisliği, Mikroelektronik, Nanoteknoloji, Biyomedikal</strong> ve <strong>Ulaştırma Bilimleri</strong> alanlarında çok güçlüdür. TU9 üyesidir.\n\n📝 <strong>Başvuru ve Kabul Şartları (Kritik Bilgiler):</strong>\n<strong>Kabul Avantajı:</strong> Batı Almanya'daki (Münih, Berlin, Aachen) üniversitelere kıyasla kabul alma ihtimalinin (NC puanlarının biraz daha düşük olması sebebiyle) daha yüksek olduğu bir üniversitedir.\n<strong>Dil Şartı:</strong> DSH-2 veya TestDaF 4x4 istenir. Üniversite bünyesinde hazırlık dil kursları (TUDIAS) mevcuttur ancak ücretli olabilir.\n<strong>Başvuru:</strong> Genellikle Uni-Assist üzerinden yapılır.\n\n🏠 <strong>Yurt ve Konaklama İmkanları:</strong>\n<strong>Büyük Avantaj:</strong> Dresden'in en büyük avantajı <strong>ekonomik</strong> olmasıdır. Yurt bulmak, Münih veya Berlin'e göre çok daha kolaydır.\n<strong>Maliyetler:</strong> Öğrenci yurtları <strong>200€ - 300€</strong> arasındadır. Özel ev kiraları da oldukça uygundur. Şehirde yaşam maliyeti düşüktür, öğrenci bütçesiyle rahat geçinilir.`

        // SAYFA YÜKLENİNCE KARTLARI OLUŞTUR
        const grid = document.getElementById('uniGrid');
        
        function renderUniversities(list) {
            grid.innerHTML = "";
            list.forEach(uni => {
                // LOGO İÇİN GOOGLE API KULLANIMI (Daha stabil)
                const logoUrl = `https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://${uni.domain}&size=256`;
                
                const card = document.createElement('div');
                card.className = 'uni-card';
                card.innerHTML = `
                    <div class="card-header">
                        <img src="${logoUrl}" alt="${uni.name}" class="uni-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <i class="fa-solid fa-building-columns uni-logo-fallback"></i>
                    </div>
                    <div class="card-body">
                        <span class="uni-city"><i class="fa-solid fa-location-dot"></i> ${uni.city}</span>
                        <h3 class="uni-title">${uni.name}</h3>
                        <p class="uni-summary">${uni.summary}</p>
                        <button class="btn-detail" onclick="openModal('${uni.name}')">İncele & Bilgi Al</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        renderUniversities(universities);

        // ARAMA FONKSİYONU
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = universities.filter(uni => 
                uni.name.toLowerCase().includes(searchTerm) || 
                uni.city.toLowerCase().includes(searchTerm) || 
                uni.summary.toLowerCase().includes(searchTerm)
            );
            renderUniversities(filtered);
        });

        // MODAL İŞLEMLERİ
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalCity = document.getElementById('modalCity');
        const modalBody = document.getElementById('modalBody');
        const modalLogo = document.getElementById('modalLogo');
        const modalWeb = document.getElementById('modalWeb');

        function openModal(uniName) {
            const uni = universities.find(u => u.name === uniName);
            if (uni) {
                modalTitle.textContent = uni.name;
                modalCity.textContent = uni.city;
                modalBody.innerHTML = uni.detail; // HTML etiketlerini işle
                
                // Modal içinde de aynı logo API
                const logoUrl = `https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://${uni.domain}&size=256`;
                modalLogo.src = logoUrl;
                modalLogo.onerror = function() { this.src = 'https://via.placeholder.com/80?text=UNI'; };
                
                modalWeb.href = `https://${uni.domain}`;
                
                modalOverlay.style.display = 'flex';
                document.body.style.overflow = 'hidden'; 
            }
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            if (event.target == modalOverlay) {
                closeModal();
            }
        }
    </script>
</body>
