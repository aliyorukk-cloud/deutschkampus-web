<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"><title>Öğrenci Girişi | DeutschKampus</title>
<link rel="stylesheet" href="fa.css"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="common.css">
</head><body>
<header><a href="index.html"><img src="logo.png" alt="DeutschKampus"></a><a class="back" href="index.html">← Ana sayfa</a></header>
<div class="wrap" style="max-width:440px">
 <div class="card" id="loginBox"><h2>Öğrenci Girişi</h2>
  <form id="f1"><label>E-posta</label><input type="email" id="em" required autocomplete="username">
  <label>Şifre</label><input type="password" id="pw" required autocomplete="current-password">
  <div style="margin-top:14px"><button class="btn" style="width:100%">Giriş Yap</button></div></form>
  <p class="muted" style="margin-top:14px"><a href="#" id="forgot">Şifremi unuttum</a></p>
  <p class="muted">Hesap, danışmanlık sözleşmesi sonrası size e-posta ile tanımlanır.</p>
  <div id="msg"></div></div>
 <div class="card" id="setBox" style="display:none"><h2 id="setTitle">Şifre belirleyin</h2>
  <form id="f2"><label>Yeni şifre (en az 10 karakter)</label><input type="password" id="np" minlength="10" required autocomplete="new-password">
  <div style="margin-top:14px"><button class="btn" style="width:100%">Şifreyi Kaydet</button></div></form><div id="msg2"></div></div>
</div>

<script src="dk.js"></script>
<script>
const $=id=>document.getElementById(id);
async function go(){const s=await DK.session();if(!s)return false;
 try{const uid=await DK.uid();const p=await DK.get('profiles','select=role&id=eq.'+uid);location.href=(p[0]&&p[0].role==='admin')?'admin.html':'portal.html';return true}catch(e){return false}}
const Q=new URLSearchParams(location.search);let TH=Q.get('token_hash');const TT=Q.get('type');
(async()=>{if(TH&&(TT==='invite'||TT==='recovery')){$('loginBox').style.display='none';$('setBox').style.display='block';$('setTitle').textContent=TT==='invite'?'Hoş geldiniz — şifrenizi belirleyin':'Yeni şifre belirleyin';return}
 const t=DK.fromHash();
 if(t==='invite'||t==='recovery'||t==='signup'){$('loginBox').style.display='none';$('setBox').style.display='block';$('setTitle').textContent=t==='invite'?'Hoş geldiniz — şifrenizi belirleyin':'Yeni şifre belirleyin';return}
 await go()})();
$('f1').onsubmit=async e=>{e.preventDefault();$('msg').innerHTML='';
 try{await DK.signIn($('em').value.trim(),$('pw').value);if(!await go())throw new Error('Profil okunamadı')}
 catch(err){$('msg').innerHTML='<div class="err">Giriş başarısız. E-posta veya şifre hatalı olabilir.</div>'}};
$('forgot').onclick=async e=>{e.preventDefault();const em=$('em').value.trim();if(!em){$('msg').innerHTML='<div class="err">Önce e-posta adresinizi yazın.</div>';return}
 try{await DK.recover(em)}catch(x){}$('msg').innerHTML='<div class="ok">Bu adres kayıtlıysa şifre sıfırlama bağlantısı gönderildi.</div>'};
$('f2').onsubmit=async e=>{e.preventDefault();
 try{if(TH){await DK.verify(TT,TH);history.replaceState(null,'',location.pathname);TH=null}await DK.setPassword($('np').value);$('msg2').innerHTML='<div class="ok">Şifre kaydedildi, yönlendiriliyorsunuz…</div>';setTimeout(go,900)}
 catch(err){$('msg2').innerHTML='<div class="err">'+esc(err.message)+'</div>'}};
</script></body></html>
